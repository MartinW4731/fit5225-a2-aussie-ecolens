<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AussieEcoLens UI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #f6f8fa;
      color: #222;
    }

    h1 {
      color: #1f4d3a;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    input, button {
      padding: 10px;
      margin: 6px 0;
      font-size: 14px;
    }

    input {
      width: 300px;
    }

    button {
      cursor: pointer;
      background: #1f7a4d;
      color: white;
      border: none;
      border-radius: 6px;
    }

    button:hover {
      background: #155c39;
    }

    .result-card {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0;
    }

    .thumb {
      max-width: 220px;
      max-height: 220px;
      display: block;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }

    .small {
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>AussieEcoLens</h1>
  <p class="small">Simple demo UI for wildlife media search</p>

  <div class="section">
    <h2>Search by Tags</h2>

    <p>Example tags:</p>
    <p class="small">
      thylogale_stigmatica, canis_familiaris, chalcophaps_longirostris, Casuarius_casuarius
    </p>

    <label>Tag name:</label><br />
    <input id="tagInput" value="thylogale_stigmatica" />

    <br />

    <label>Minimum count:</label><br />
    <input id="countInput" type="number" value="1" />

    <br />

    <button onclick="searchByTags()">Search</button>
  </div>

  <div class="section">
    <h2>Results</h2>
    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const API_BASE_URL = "https://qpl03337ra.execute-api.ap-southeast-2.amazonaws.com";

    async function searchByTags() {
      const tag = document.getElementById("tagInput").value.trim();
      const count = Number(document.getElementById("countInput").value);

      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");

      resultsDiv.innerHTML = "";
      statusDiv.innerHTML = "Searching...";

      if (!tag) {
        statusDiv.innerHTML = "Please enter a tag.";
        return;
      }

      const payload = {
        tags: {}
      };

      payload.tags[tag] = count;

      try {
        const response = await fetch(`${API_BASE_URL}/query/by-tags`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        console.log(data);

        statusDiv.innerHTML = `Found ${data.count || 0} result(s).`;

        if (!data.results || data.results.length === 0) {
          resultsDiv.innerHTML = "<p>No results found.</p>";
          return;
        }

        data.results.forEach(item => {
          const card = document.createElement("div");
          card.className = "result-card";

          let mediaPreview = "";

          if (item.file_type === "image" && item.thumbnail_presigned_url) {
            mediaPreview = `
              <img class="thumb" src="${item.thumbnail_presigned_url}" alt="${item.file_name}" />
            `;
          } else if (item.file_type === "video") {
            mediaPreview = `
              <p><strong>Video file</strong></p>
            `;
          }

          const openLink = item.file_presigned_url
            ? `<p><a href="${item.file_presigned_url}" target="_blank">Open full ${item.file_type}</a></p>`
            : "";

          card.innerHTML = `
            <h3>${item.file_name}</h3>
            <p><strong>Type:</strong> ${item.file_type}</p>
            ${mediaPreview}
            ${openLink}

            <p><strong>S3 URL:</strong></p>
            <pre>${item.file_url || ""}</pre>

            <p><strong>Tags:</strong></p>
            <pre>${JSON.stringify(item.tags || {}, null, 2)}</pre>

            <p><strong>Confidence:</strong></p>
            <pre>${JSON.stringify(item.confidence || {}, null, 2)}</pre>

            <p><strong>Frames processed:</strong> ${item.frames_processed || 0}</p>
          `;

          resultsDiv.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = "Search failed. Check browser console or API CORS settings.";
      }
    }
  </script>
</body>
</html>
